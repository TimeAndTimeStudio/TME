<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#E8751A;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#F59E0B;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#E8751A;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FFFFFF;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FFF3E0;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
  </defs>
  
  <!-- Outer rounded rectangle with gradient -->
  <rect x="2" y="2" width="60" height="60" rx="14" ry="14" fill="url(#bg)" filter="url(#shadow)"/>
  
  <!-- Inner rounded rectangle (highlight) -->
  <rect x="4" y="4" width="56" height="56" rx="12" ry="12" fill="none" stroke="#FFFFFF" stroke-width="1.5" opacity="0.6"/>
  
  <!-- Subtle inner shadow effect -->
  <rect x="2" y="2" width="60" height="60" rx="14" ry="14" fill="none" stroke="#000000" stroke-width="1" opacity="0.15"/>
  
  <!-- T Text -->
  <text x="14" y="42" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="900" fill="url(#textGrad)" text-anchor="middle">T</text>
  
  <!-- S Text -->
  <text x="32" y="42" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="900" fill="url(#textGrad)" text-anchor="middle">S</text>
  
  <!-- L Text -->
  <text x="50" y="42" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="900" fill="url(#textGrad)" text-anchor="middle">L</text>
</svg>
